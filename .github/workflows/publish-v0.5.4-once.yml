name: Publish approved Flexalon v0.5.4 (one-time)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'PhuNope/cocos-flexalon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version and absence of existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "0.5.4"
          if gh release view v0.5.4 >/dev/null 2>&1; then
            echo "v0.5.4 already published, refusing to overwrite."
            exit 1
          fi
          if gh api repos/${{ github.repository }}/git/ref/tags/v0.5.4 >/dev/null 2>&1; then
            echo "v0.5.4 tag exists, refusing to move an existing tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build, run tests, create and verify installer ZIP
        run: npm run release

      - name: Verify generated ZIP again
        run: npm run release:check

      - name: Publish GitHub Release and installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="release/flexalon-tools-v0.5.4.zip"
          test -f "$archive"
          gh release create v0.5.4 "$archive" \
            --target "$GITHUB_SHA" \
            --title "Flexalon Cocos v0.5.4" \
            --generate-notes \
            --notes "Stable release of the approved dev.7 build. Improvements: nested-layout Gizmos; Grid cell/span/hex Gizmos; Curve Animator Gizmos, pause, start positioning and slider steps; UI drag/reorder; Fill Parent Fallback for Canvas/UITransform. Requires Cocos Creator >= 3.8.2. Install as project/extensions/flexalon-tools; install Cocos-Gizmos separately for Scene Gizmos."
