name: Publish approved Flexalon v0.5.5 (one-time)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'PhuNope/cocos-flexalon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check stable release version and reject duplicate tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "0.5.5"
          if gh release view v0.5.5 >/dev/null 2>&1; then
            echo "Release v0.5.5 already exists. Will not overwrite it."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.5.5" >/dev/null 2>&1; then
            echo "Tag v0.5.5 already exists. Will not move a tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build, behavioral tests, ZIP integrity and offline updater tests
        run: npm run release

      - name: Revalidate ZIP
        run: npm run release:check

      - name: Publish Release v0.5.5 with installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="release/flexalon-tools-v0.5.5.zip"
          test -f "$archive"
          gh release create v0.5.5 "$archive" \
            --target "$GITHUB_SHA" \
            --title "Flexalon Cocos v0.5.5" \
            --generate-notes \
            --notes "Stable Flexalon v0.5.5. Adds Auto Updater with GitHub Release checks and a Guide Panel Check Update tab, download progress, verified ZIP replacement, rollback, normal Editor shutdown, project temp/library cache cleanup after Editor exit, and full .flexalon-updater workspace removal on success. Requires Cocos Creator >=3.8.2. Please save Scenes and back up your project before installing or updating."
