name: Flexalon Dev QA

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies and auto-build
        run: npm ci
      - name: Verify postinstall generated tracked Editor output
        run: |
          test -f dist/main.js && test -f dist/scene.js && test -f dist/panels/guide.js
          git diff --exit-code -- dist/
          test -z "$(git status --porcelain --untracked-files=all -- dist/)"
      - name: Build, behavioral tests and ZIP integrity
        run: npm run release
      - name: Upload dev test ZIP (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: flexalon-tools-dev-build
          path: release/flexalon-tools-v*.zip
          if-no-files-found: error
          retention-days: 14
