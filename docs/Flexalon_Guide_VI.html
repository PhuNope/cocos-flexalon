<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flexalon Cocos — Hướng dẫn component</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141d}body{font-family:'Segoe UI',sans-serif}:host{display:block;width:100%;height:100%;min-width:270px;background:#10141d;color:#e5ecf5;font:13px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
*{box-sizing:border-box}
.fl-guide-app{height:100%;width:100%;min-height:280px;overflow:hidden;--muted:#a7b6c9;--line:#2a3547;--panel:#171f2c;--panelAlt:#121a26;--accent:#6cc4fd;--accentSoft:rgba(108,196,253,.12);--cream:#ebf4ff;}
.fl-guide-app button,.fl-guide-app input{font:inherit}
.guide-layout{height:100%;display:flex;flex-direction:column;overflow:hidden}
.guide-header{height:60px;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(110deg,#192a3d,#101925);border-bottom:1px solid var(--line);flex:0 0 auto;}
.guide-brand{display:flex;align-items:center;gap:12px;min-width:0}
.guide-logo{width:35px;height:35px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#3fa6da,#8d6cf3);color:#fff;font-size:22px;flex:0 0 auto;box-shadow:0 4px 18px #348ae244;}
.guide-brand-name{font-size:16px;font-weight:750;line-height:1.15;white-space:nowrap;letter-spacing:.3px}
.guide-brand-caption{font-size:11px;color:var(--muted);white-space:nowrap}
.guide-version{font-size:10px;color:#bcdcf5;background:#20354d;padding:4px 9px;border:1px solid #376080;border-radius:30px;white-space:nowrap;}
.guide-main{display:flex;flex:1;min-height:0;}
.guide-sidebar{width:236px;flex:0 0 236px;border-right:1px solid var(--line);background:#121924;display:flex;flex-direction:column;min-height:0}
.guide-search-wrap{padding:15px 13px 9px;position:relative;}
.guide-search{width:100%;height:35px;outline:none;background:#202b3b;border:1px solid #334255;border-radius:9px;color:#eff7ff;padding:0 12px 0 32px;transition:border-color .15s}
.guide-search:focus{border-color:#53adf2;box-shadow:0 0 0 2px rgba(83,173,242,.12)}
.guide-search::placeholder{color:#8b9bb1}
.guide-search-icon{position:absolute;left:23px;top:23px;color:#8d9caf;pointer-events:none}
.guide-nav{overflow:auto;flex:1;padding:0 8px 16px;scrollbar-width:thin;scrollbar-color:#41556c transparent}
.guide-group{margin:15px 5px 5px;padding:0 6px;color:#8fa1b7;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.guide-item{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:#b5c5d9;border-radius:9px;margin:2px 0;padding:9px 10px;text-align:left;cursor:pointer;min-height:36px;}
.guide-item:hover{background:#1e2a39;color:#f4faff}
.guide-item.active{background:#233c57;border-color:#34648a;color:#e2f5ff}
.guide-item-icon{width:21px;text-align:center;color:#87cef6;font-size:16px;flex:0 0 auto}
.guide-item-label{font-size:12px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.guide-count{margin:0 13px 13px;padding:9px 10px;border:1px solid #273447;border-radius:8px;color:#92a8c1;font-size:11px}
.guide-empty{padding:15px;color:var(--muted);font-size:12px}
.guide-content{overflow-y:auto;overflow-x:hidden;flex:1;min-width:0;scrollbar-width:thin;scrollbar-color:#3b566b transparent;background:radial-gradient(circle at 90% -100px,#12345280 0,transparent 430px),#111722}
.guide-page{max-width:1040px;margin:0 auto;padding:28px clamp(18px,4.5vw,52px) 70px;}
.guide-eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#82badb;font-weight:700}
.guide-time{letter-spacing:0;text-transform:none;color:#a2adbd;border:1px solid #3b4554;padding:2px 7px;border-radius:5px}
.guide-h1{font-size:clamp(25px,3vw,37px);font-weight:780;line-height:1.2;color:#f3f8ff;letter-spacing:-.03em;margin:10px 0 8px}
.guide-tagline{font-size:15px;color:#b9cbde;margin:0 0 18px}
.guide-intro{font-size:13px;line-height:1.8;color:#bed0e4;margin:0 0 20px;max-width:790px}
.guide-diagram{background:linear-gradient(155deg,#202d3e,#182334);border:1px solid #324558;border-radius:15px;overflow:hidden;position:relative;margin:0 0 24px;}
.guide-diagram .guide-diagram-caption{font-size:11px;color:#b0c3d7;padding:0 17px 13px;display:flex;align-items:center;gap:7px}
.guide-diagram svg{width:100%;height:auto;max-height:290px;min-height:125px;display:block}
.guide-diagram circle,.guide-diagram rect,.guide-diagram path,.guide-diagram line{vector-effect:non-scaling-stroke}
.guide-section{margin-top:26px;scroll-margin-top:18px}
.guide-section-head{display:flex;gap:9px;align-items:center;margin:0 0 11px;color:#eff7ff;font-size:15px;font-weight:700}
.guide-section-head:before{content:'';height:17px;width:3px;border-radius:3px;background:#65baf0}
.guide-section-copy{font-size:13px;color:#b9c8d8;margin:0}
.guide-card{background:var(--panel);border:1px solid #304056;border-radius:12px;padding:15px 18px}
.guide-tree-card{background:#101a26;border:1px solid #304359;border-radius:11px;overflow:hidden}
.guide-tree-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:#1d2b3e;border-bottom:1px solid #344459;color:#aac7da;font-size:11px;font-weight:700}
.guide-copy,.guide-nav-btn{cursor:pointer;background:#20354a;border:1px solid #395772;color:#d4eaff;border-radius:7px;padding:5px 10px;font-size:11px;}
.guide-copy:hover,.guide-nav-btn:hover{background:#294662;color:white}
.guide-tree{font-family:Consolas,'Cascadia Mono',Menlo,monospace;white-space:pre;overflow:auto;color:#b5dfc9;font-size:12px;line-height:1.9;padding:16px;margin:0;}
.guide-steps{counter-reset:guide-step;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.guide-steps li{counter-increment:guide-step;display:flex;gap:11px;align-items:flex-start;color:#ccdaeb;padding:11px 13px;border-radius:10px;background:#182331;border:1px solid #2a3b4f;line-height:1.65}
.guide-steps li::before{content:counter(guide-step);width:23px;height:23px;flex:0 0 23px;border-radius:7px;display:grid;place-items:center;background:#275574;color:#bfe8ff;font-size:11px;font-weight:800;margin-top:0px}
.guide-table-wrap{overflow:auto;border:1px solid #334458;border-radius:11px;background:#192334}
.guide-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;min-width:450px;line-height:1.6}
.guide-table th{background:#223148;color:#a5d9fc;padding:11px 13px;font-size:11px;letter-spacing:.02em;font-weight:700}
.guide-table td{border-top:1px solid #2a3a4f;padding:10px 13px;vertical-align:top;color:#c0d0df}
.guide-table td:first-child{color:#e2edfa;font-weight:650;font-family:Consolas,monospace;font-size:11px}
.guide-table td:nth-child(2){color:#9addca;white-space:normal}
.guide-note{display:flex;align-items:flex-start;gap:9px;color:#c7d4e1;background:#162635;border:1px solid #305169;border-radius:10px;padding:12px 14px;margin:0 0 8px;font-size:12px;line-height:1.65}
.guide-note-icon{color:#f3c878;font-size:15px;flex:0 0 auto}
.guide-challenge{display:flex;align-items:flex-start;gap:12px;background:linear-gradient(115deg,#153b4a,#223449);border:1px solid #387b89;padding:17px;border-radius:11px;color:#d9f8f3;line-height:1.7}
.guide-challenge-icon{font-size:23px}
.guide-inline-navigation{border-top:1px solid var(--line);margin-top:33px;padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.guide-nav-btn{padding:8px 13px;font-size:12px}
.guide-related{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.guide-related button{background:#1b293b;color:#a9d2ec;border:1px solid #2d4a60;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px}
.guide-related button:hover{background:#27435a}
.guide-toast{position:absolute;right:18px;bottom:18px;background:#246552;color:#fff;padding:10px 15px;border:1px solid #55a98a;border-radius:9px;pointer-events:none;box-shadow:0 8px 30px #0008;font-size:12px;z-index:10}
.guide-footer{font-size:11px;color:#8096ac;margin-top:25px;border-top:1px solid #263449;padding-top:13px;}
@media(max-width:690px){.guide-sidebar{width:172px;flex-basis:172px}.guide-item{padding:8px 5px;gap:5px}.guide-header{padding:10px 13px}.guide-page{padding:20px 15px 50px}.guide-brand-name{font-size:14px}.guide-version{display:none}.guide-tree{font-size:10px}}
@media(max-width:420px){.guide-sidebar{width:52px;flex-basis:52px}.guide-search-wrap{padding:8px 4px}.guide-search{padding:4px;width:100%}.guide-search-icon,.guide-group,.guide-item-label,.guide-count{display:none}.guide-item{justify-content:center}.guide-item-icon{font-size:17px}.guide-page{padding:16px 12px 36px}}
</style></head><body><div id="guide-app" class="fl-guide-app" aria-label="Hướng dẫn Flexalon">
  <div class="guide-loading">Đang mở hướng dẫn Flexalon…</div>
</div>
<script>
(function(){
let module={exports:{}};
'use strict';
/** Shared offline renderer. Runs inside Cocos Editor panel without external dependencies. */
const escapeHtml = (v) => String(v == null ? '' : v).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C = {blue:'#5bafe2',teal:'#3fc5aa',purple:'#997ce5',yellow:'#f0c76a',slate:'#2b4865'};
function rectangle(x,y,w,h,fill=C.blue,label='',stroke='',radius=10) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${radius}" fill="${fill}" stroke="${stroke||'#b5e1ff40'}" stroke-width="1.3"/>`+
      (label?`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" fill="#eefaff" font-weight="700" font-size="${Math.min(13,w>100?12:11)}">${escapeHtml(label)}</text>`:'');
}
function ellipse(x,y,r,fill=C.blue,label='') {
 return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#e8faff6b" stroke-width="1.1"/>${label?`<text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">${escapeHtml(label)}</text>`:''}`;
}
function text(x,y,label,fill='#aac7dd',size=13,anchor='start') {
 return `<text x="${x}" y="${y}" fill="${fill}" text-anchor="${anchor}" font-size="${size}" font-family="Segoe UI,sans-serif">${escapeHtml(label)}</text>`;
}
function path(d,color='#9ad3f9',width=2,dash='') { return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" stroke-linejoin="round"/>` }
function polygon(x,y,r,n,color=C.blue,rotation=-Math.PI/2) {
 let coords=[]; for(let i=0;i<n;i++){const a=rotation+i*Math.PI*2/n;coords.push(`${(x+r*Math.cos(a)).toFixed(2)},${(y+r*Math.sin(a)).toFixed(2)}`)}
 return `<polygon points="${coords.join(' ')}" fill="${color}" stroke="#ecfaff80" stroke-width="1.3"/>`;
}
function diagram(kind) {
 let s='';
 switch(kind) {
 case 'overview':
   s+=text(46,42,'SCENE / UI LAYOUT',C.yellow,12);
   s+=rectangle(42,62,550,155,'#1b3348','','#54708a',16);
   for(let i=0;i<3;i++)s+=rectangle(79+i*166,108,134,65,[C.blue,C.teal,C.purple][i],`Item ${i+1}`);
   s+=text(317,198,'Container • Flexible Layout', '#b3d7eb',12,'middle');break;
 case 'object':
   s+=rectangle(105,48,440,168,'#152f3c','','#68808e',15);
   s+=rectangle(171,83,310,99,C.teal,'Fixed 200 × 80');
   s+=path('M171 196 H481 M171 190 V202 M481 190 V202',C.yellow,1.6);
   s+=text(325,213,'UITransform.contentSize',C.yellow,12,'middle');
   s+=text(112,73,'Margin',C.blue,12); break;
 case 'flex':
   for(let row=0;row<3;row++){
    const n=row===2?1:3;
    for(let c=0;c<n;c++) s+=rectangle(81+c*164,30+row*76,138,59,[C.blue,C.teal,C.purple][row],`${row*3+c+1}`);
   }
   s+=text(560,51,'3 / dòng',C.yellow,12);s+=path('M562 70 V199',C.yellow,1.3,'4,4');break;
 case 'grid':
   s+=text(30,34,'RECTANGLE • FitChildren',C.yellow,11);
   s+=rectangle(58,57,252,60,C.blue,'180 × 50');
   s+=rectangle(324,76,150,39,C.teal,'60 × 20');
   s+=rectangle(163,130,50,89,C.blue,'40 × 90');
   s+=rectangle(324,155,150,50,C.teal,'120 × 30');
   s+=path('M317 48 V230', '#5c8299',1,'3,6');
   s+=text(522,151,'Cột tự đo', '#b4d6ee',12);break;
 case 'span':
   s+=text(54,35,'Grid • Columns = 3',C.yellow,12);
   s+=rectangle(57,53,324,77,C.blue,'Column Span 2');
   s+=rectangle(392,53,143,77,C.teal,'Item 2');
   for(let i=0;i<3;i++)s+=rectangle(57+i*167,140,155,72,C.slate,`Cell ${i+1}`);
   break;
 case 'circle':
   for(const r of [54,93])s+=`<circle cx="320" cy="129" r="${r}" fill="none" stroke="#52738e" stroke-dasharray="4 5" stroke-width="1.5"/>`;
   for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI/3;const r=i<6?54:93; s+=ellipse(320+Math.cos(a)*r,129+Math.sin(a)*r,13,i<6?C.blue:C.teal,`${i+1}`)}
   s+=ellipse(320,129,4,C.yellow); s+=text(465,73,'Radius Type',C.yellow,12);s+=text(465,94,'Wrap / Step',C.yellow,12);break;
 case 'align':
   s+=rectangle(73,45,487,169,'#172b3e','','#577795',16);
   s+=rectangle(238,91,165,93,C.slate,'Icon', '#73a0c6',14);
   s+=ellipse(403,90,26,C.yellow,'9');
   s+=path('M320 45 V215 M74 130 H559','#47627c',1,'4,6');
   s+=text(318,235,'Center + Offset',C.yellow,12,'middle');break;
 case 'curve':
 case 'curve-anim':
   s+=path('M60 181 C200 3 360 263 575 61',C.teal,3);
   s+=path('M60 181 L200 3 M360 263 L575 61','#72879a',1.2,'5,6');
   const cp=[[60,181],[200,3],[360,263],[575,61]];
   for(const [idx,p] of cp.entries())s+=ellipse(p[0],p[1],8,C.purple,`P${idx}`);
   for(let i=1;i<=5;i++){const t=i/6;const x=Math.pow(1-t,3)*60+3*Math.pow(1-t,2)*t*200+3*(1-t)*t*t*360+Math.pow(t,3)*575;
    const y=Math.pow(1-t,3)*181+3*Math.pow(1-t,2)*t*3+3*(1-t)*t*t*263+Math.pow(t,3)*61;
    s+=ellipse(x,y,13,C.blue,kind==='curve-anim'?'▶':`${i}`)}
   break;
 case 'random':
   {const pts=[[72,59],[157,163],[234,49],[302,194],[379,102],[475,176],[541,45],[242,134],[473,68]];
   s+=rectangle(35,24,560,205,'#182b3f','','#466981',14);
   pts.forEach((p,i)=>s+=ellipse(p[0],p[1],15,i%2?C.teal:C.purple,`${i+1}`));break;}
 case 'shape':
   s+=polygon(320,128,91,6,'#1b3b4a');
   for(let i=0;i<6;i++)s+=ellipse(320+91*Math.cos(-Math.PI/2+i*Math.PI/3),128+91*Math.sin(-Math.PI/2+i*Math.PI/3),14,C.blue,`${i+1}`);
   s+=text(461,127,'Polygon • 6 sides',C.yellow,12);break;
 case 'constraint':
   s+=rectangle(78,95,163,70,C.blue,'Target');s+=rectangle(391,57,163,70,C.teal,'Follower');
   s+=path('M251 128 L379 92 M368 87 L379 92 L373 104',C.yellow,3);
   s+=text(298,64,'World Offset',C.yellow,12,'middle');break;
 case 'modifier':
   for(let i=0;i<4;i++){
    const x=76+i*140;
    s+=rectangle(x,97,98,59,'#21384d','','#53758d');
    s+=path(`M${x+48} 126 l${[-13,9,-7,13][i]} ${[16,-13,14,-6][i]}`,C.yellow,2,'3,4');
    s+=rectangle(x+[-13,9,-7,13][i],97+[16,-13,14,-6][i],98,59,i%2?C.teal:C.blue,`${i+1}`);
   }break;
 case 'clone':
   s+=rectangle(40,91,133,72,C.yellow,'Prefab');
   s+=path('M177 128 H238 M230 119 L239 128 L230 137',C.yellow,2.2);
   for(let i=0;i<3;i++)s+=rectangle(264+i*113,92,98,71,i===1?C.teal:C.blue,`#${i+1}`);
   s+=text(323,188,'Count = 3',C.yellow,12,'middle');break;
 case 'ratio':
   s+=rectangle(151,42,346,170,'#2f5270','','#70a4c7',8);
   s+=rectangle(173,54,304,171,C.blue,'16 : 9');
   s+=text(322,244,'Width / Height = 1.7778',C.yellow,13,'middle');break;
 case 'anim':
   s+=rectangle(53,95,115,67,'#284058','','#477691');s+=rectangle(466,95,115,67,C.teal,'Target');
   s+=path('M175 130 H447 M437 120 L449 130 L437 140',C.yellow,2.5,'6,6');
   s+=rectangle(285,97,100,64,C.blue,'Lerp');s+=text(316,190,'Speed →',C.yellow,12,'middle');break;
 case 'drag':
   s+=rectangle(57,70,520,116,'#19354a','','#51758b',16);
   s+=rectangle(102,91,122,75,C.blue,'Drag');
   s+=rectangle(390,48,128,77,C.teal,'Item');
   s+=path('M233 129 C293 138 314 78 378 83 M365 74 L380 83 L371 97',C.yellow,3,'6,6');
   s+=text(281,211,'skipLayout during drag',C.yellow,12,'middle');break;
 case 'drop':
   s+=rectangle(78,89,141,78,C.blue,'Source');
   s+=path('M225 129 H401 M388 116 L402 129 L388 142',C.yellow,2.5,'6,6');
   s+=rectangle(415,60,141,130,'#1b3b47','Drop Zone',C.teal,12);break;
 case 'manager':
   s+=rectangle(220,27,205,61,C.purple,'Manager');
   s+=path('M322 92 V128 M144 128 H504 M144 128 V155 M322 128 V155 M504 128 V155',C.yellow,2);
   for(let i=0;i<3;i++)s+=rectangle(83+i*180,155,122,59,[C.blue,C.teal,C.blue][i],['Grid','Flexible','Circle'][i]);break;
 default:s+=rectangle(158,60,320,130,C.blue,'Flexalon');
 }
 const defs=`<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#456175" stroke-opacity=".14" stroke-width="1"/></pattern></defs>`;
 return `<svg viewBox="0 0 640 255" role="img" aria-label="Minh họa bố cục ${escapeHtml(kind)}" xmlns="http://www.w3.org/2000/svg">${defs}<rect x="0" y="0" width="640" height="255" fill="url(#g)"/>${s}</svg>`;
}
function itemHTML(d,active) {
  return `<button class="guide-item${d.id===active?' active':''}" type="button" data-guide="${escapeHtml(d.id)}" title="${escapeHtml(d.name)}"><span class="guide-item-icon">${escapeHtml(d.glyph)}</span><span class="guide-item-label">${escapeHtml(d.name)}</span></button>`;
}
function renderPage(doc,all) {
 const i=all.findIndex(v=>v.id===doc.id);
 const related=all.filter(v=>v.group===doc.group && v.id!==doc.id).slice(0,4);
 return `<article class="guide-page">
 <div class="guide-eyebrow"><span>${escapeHtml(doc.group)}</span><span class="guide-time">⏱ ${escapeHtml(doc.time)}</span><span class="guide-time">Cocos Creator >= 3.8.2</span></div>
 <h1 class="guide-h1">${escapeHtml(doc.name)}</h1><p class="guide-tagline">${escapeHtml(doc.tagline)}</p><p class="guide-intro">${escapeHtml(doc.intro)}</p>
 <figure class="guide-diagram" style="margin-left:0;margin-right:0">${diagram(doc.diagram)}<figcaption class="guide-diagram-caption">✧ Hình minh họa bố cục — không phải ảnh chụp Editor</figcaption></figure>
 <section class="guide-section"><h2 class="guide-section-head">Khi nào nên dùng?</h2><p class="guide-section-copy">${escapeHtml(doc.use)}</p></section>
 <section class="guide-section"><h2 class="guide-section-head">Cấu trúc Node mẫu</h2><div class="guide-tree-card"><div class="guide-tree-head">SCENE HIERARCHY <button type="button" class="guide-copy" data-copy="tree">⧉ Sao chép</button></div><pre class="guide-tree">${escapeHtml(doc.tree)}</pre></div></section>
 <section class="guide-section"><h2 class="guide-section-head">Hướng dẫn từng bước</h2><ol class="guide-steps">${doc.steps.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol></section>

function mount(root, docs, options={}) {
 if(!root || !Array.isArray(docs)||!docs.length)throw new Error('Flexalon Guide: invalid mount arguments');
 const store={active:options.initialId&&docs.find(x=>x.id===options.initialId)?options.initialId:docs[0].id, search:''};
 const groups=[...new Set(docs.map(d=>d.group))];
 root.innerHTML=`<div class="guide-layout"><header class="guide-header"><div class="guide-brand"><div class="guide-logo">◈</div><div><div class="guide-brand-name">FLEXALON <span style="color:#87d8ff">GUIDE</span></div><div class="guide-brand-caption">Cocos Creator • Hướng dẫn thực hành</div></div></div><span class="guide-version">v0.5.2</span></header><div class="guide-main"><aside class="guide-sidebar"><div class="guide-search-wrap"><span class="guide-search-icon">⌕</span><input class="guide-search" type="search" placeholder="Tìm component..." aria-label="Tìm component" spellcheck="false"></div><nav class="guide-nav" aria-label="Danh sách bài hướng dẫn"></nav><div class="guide-count">19 bài · 18 component<br/>Hình minh họa · Offline</div></aside><main class="guide-content" tabindex="-1"></main></div></div>`;
 const nav=root.querySelector('.guide-nav'); const content=root.querySelector('.guide-content');const search=root.querySelector('.guide-search');
 function showNav(){
    const q=store.search.toLowerCase().trim();const matches=d=>[d.name,d.group,d.tagline,d.intro,d.use,...d.fields.map(f=>f[0])].join(' ').toLowerCase().includes(q);
    const matchesAll=docs.filter(matches);
    nav.innerHTML=groups.map(g=>{
      const selected=matchesAll.filter(d=>d.group===g);
      return selected.length?`<div class="guide-group">${escapeHtml(g)}</div>${selected.map(d=>itemHTML(d,store.active)).join('')}`:'';
    }).join('') || '<p class="guide-empty">Không tìm thấy component phù hợp.</p>';
 }
 function navigate(id){
    const doc=docs.find(d=>d.id===id);if(!doc)return;
    store.active=id;showNav();content.innerHTML=renderPage(doc,docs);content.scrollTop=0;
 }
 const onInput=()=>{store.search=search.value;showNav()};
 const onClick=async(e)=>{
    const btn=e.target&&e.target.closest?e.target.closest('[data-guide],[data-copy]'):null;
    if(!btn||!root.contains(btn)||btn.disabled)return;
    if(btn.hasAttribute('data-guide')){navigate(btn.getAttribute('data-guide'));return;}
    if(btn.getAttribute('data-copy')==='tree') {
      const doc=docs.find(d=>d.id===store.active);if(!doc)return;
      try {if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(doc.tree);
        else {const t=document.createElement('textarea');t.value=doc.tree;root.appendChild(t);t.select();document.execCommand('copy');t.remove()}
        const toast=document.createElement('div');toast.className='guide-toast';toast.textContent='Đã sao chép cấu trúc Node';root.appendChild(toast);setTimeout(()=>toast.remove(),1500);
      } catch(err){console.warn('[Flexalon Guide] Copy unavailable',err)}
    }
 };
 const onKey=(e)=>{ if(e.key==='/'&&e.target!==search&&!e.ctrlKey&&!e.metaKey){e.preventDefault();search.focus()}else if(e.key==='Escape'&&e.target===search){search.value='';onInput();search.blur()} };
 root.addEventListener('click',onClick);root.addEventListener('keydown',onKey);search.addEventListener('input',onInput);navigate(store.active);
 return {go:navigate, getState:()=>({...store}),destroy(){search.removeEventListener('input',onInput);root.removeEventListener('click',onClick);root.removeEventListener('keydown',onKey);root.textContent=''}};
}
